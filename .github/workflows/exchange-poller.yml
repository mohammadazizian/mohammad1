name: Exchange announcement poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: exchange-poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout poller data
        uses: actions/checkout@v4
        with:
          ref: poller-data
          path: poller-data
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll once
        env:
          WEBHOOK_URL: ${{ secrets.EXCHANGE_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.EXCHANGE_WEBHOOK_KEY }}
          POLLER_DATA_DIR: ${{ github.workspace }}/poller-data
          PYTHONUNBUFFERED: "1"
        run: python3 exchange_poller/poller.py --once --data-dir "${{ github.workspace }}/poller-data"

      - name: Persist poller data
        if: always()
        run: bash exchange_poller/commit_data.sh "${{ github.workspace }}/poller-data"
